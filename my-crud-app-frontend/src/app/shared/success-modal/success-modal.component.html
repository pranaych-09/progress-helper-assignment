<div class="modal-backdrop" *ngIf="show">
  <div class="modal-card" [ngClass]="type">
    <span class="modal-icon">
      <ng-container [ngSwitch]="type">
        <span *ngSwitchCase="'success'">&#10003;</span> <!-- checkmark -->
        <span *ngSwitchCase="'error'">&#10060;</span>   <!-- cross mark -->
        <span *ngSwitchCase="'info'">&#8505;</span>     <!-- info symbol -->
      </ng-container>
    </span>
    <span class="modal-message">{{ message }}</span>
  </div>
</div>
