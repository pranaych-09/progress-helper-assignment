<h2 mat-dialog-title>
  Employee Identity - {{ data.empID }}
  <button mat-icon-button class="close-btn" mat-dialog-close>

  </button>

<mat-dialog-content>
  <qrcode [qrdata]="qrData" [width]="200"></qrcode>
<br /><br />

</mat-dialog-content>
